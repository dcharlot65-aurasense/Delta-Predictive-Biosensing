[workspace]
resolver = "2"
members = [
    "crates/dpb-core",
    "crates/dpb-cognitive",
    "crates/dpb-encoders",
    "crates/dpb-neurons",
    "crates/dpb-snn",
    "crates/dpb-synth",
    "crates/dpb-norms",
    "crates/dpb-python",
    "crates/dpb-ffi",
    "crates/dpb-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["AuraSense Tech Corporation"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/AuraSenseTech/dpb-framework"
description = "Delta-Predictive Biosensing Framework - Neuromorphic signal processing"
rust-version = "1.92.0"

[workspace.dependencies]
# Core dependencies
wgpu = "24.0"
bytemuck = { version = "1.21", features = ["derive"] }
glam = "0.29"
nalgebra = "0.33"
ndarray = "0.16"
num-complex = "0.4"
rustfft = "6.2"

# Async/parallel
tokio = { version = "1.42", features = ["full"] }
rayon = "1.10"
crossbeam = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Random/stats
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"
statrs = "0.18"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Python bindings
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"

# Testing
approx = "0.5"
criterion = "0.5"
tempfile = "3.14"

# Internal crates
dpb-core = { path = "crates/dpb-core" }
dpb-encoders = { path = "crates/dpb-encoders" }
dpb-neurons = { path = "crates/dpb-neurons" }
dpb-snn = { path = "crates/dpb-snn" }
dpb-synth = { path = "crates/dpb-synth" }
dpb-cognitive = { path = "crates/dpb-cognitive" }
dpb-norms = { path = "crates/dpb-norms" }
dpb-bench = { path = "crates/dpb-bench" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1

# Integration tests package
[package]
name = "dpb-integration-tests"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
dpb-core = { workspace = true }
dpb-encoders = { workspace = true }
dpb-snn = { workspace = true }
dpb-synth = { workspace = true }

# Test dependencies
approx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ndarray = { workspace = true }

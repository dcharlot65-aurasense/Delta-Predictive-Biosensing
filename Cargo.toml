[workspace]
resolver = "3"
members = [
    "crates/dpb-core",
    "crates/dpb-cognitive",
    "crates/dpb-encoders",
    "crates/dpb-neurons",
    "crates/dpb-snn",
    "crates/dpb-synth",
    "crates/dpb-norms",
    "crates/dpb-python",
    "crates/dpb-ffi",
    "crates/dpb-bench",
    "crates/dpb-mobile",
    "crates/dpb-viz",
    "crates/dpb-wasm",
    "crates/dpb-lsl",
    "crates/dpb-export",
    "crates/dpb-clinical",
    "crates/dpb-federated",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["AuraSense Tech Corporation"]
license = "Apache-2.0"
repository = "https://github.com/dcharlot65-aurasense/Delta-Predictive-Biosensing"
description = "Delta-Predictive Biosensing Framework - Neuromorphic signal processing"
rust-version = "1.92.0"

[workspace.dependencies]
# Core dependencies
wgpu = "30.0"
# wgpu 30 made adapter enumeration async; pollster blocks on it from the
# synchronous Python binding without pulling in a full async runtime.
pollster = "0.4"
bytemuck = { version = "1.24", features = ["derive"] }
glam = "0.33"
nalgebra = "0.33"
ndarray = "0.16"
num-complex = "0.4"
rustfft = "6.2"

# Async/parallel
tokio = { version = "1.42", features = ["full"] }
rayon = "1.10"
crossbeam = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# bincode 3.0.0 is a deliberate placeholder release whose crate body is a
# single `compile_error!` pointing at xkcd 2347; 2.x is the current usable
# line. The `serde` feature keeps derive-based (de)serialisation.
bincode = { version = "2.0", features = ["serde"] }

# Random/stats
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"
statrs = "0.18"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Python bindings
# `extension-module` is NOT enabled here. It tells pyo3 to leave the Python
# symbols unresolved for the host interpreter to supply at import time, which
# is right for a wheel but leaves a plain `cargo build` unable to link and
# `cargo test` without an interpreter. dpb-python exposes it as an optional
# feature that maturin turns on; see crates/dpb-python/pyproject.toml.
pyo3 = { version = "0.29" }
numpy = "0.29"  # must track the pyo3 major version

# Testing
approx = "0.5"
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3.14"
iai-callgrind = "0.14"
proptest = "1.5"

# GPU Backends (optional in individual crates)
cudarc = { version = "0.12", features = ["cublas"] }
metal = { version = "0.29" }
vulkano = { version = "0.34" }

# Additional compute
faer = "0.20"

# Internal crates
dpb-core = { path = "crates/dpb-core" }
dpb-encoders = { path = "crates/dpb-encoders" }
dpb-neurons = { path = "crates/dpb-neurons" }
dpb-snn = { path = "crates/dpb-snn" }
dpb-synth = { path = "crates/dpb-synth" }
dpb-cognitive = { path = "crates/dpb-cognitive" }
dpb-norms = { path = "crates/dpb-norms" }
dpb-bench = { path = "crates/dpb-bench" }
dpb-mobile = { path = "crates/dpb-mobile" }
dpb-viz = { path = "crates/dpb-viz" }
dpb-wasm = { path = "crates/dpb-wasm" }
dpb-lsl = { path = "crates/dpb-lsl" }
dpb-export = { path = "crates/dpb-export" }
dpb-clinical = { path = "crates/dpb-clinical" }
dpb-federated = { path = "crates/dpb-federated" }

# Workspace-wide lint configuration
# Based on Rust 2025 best practices
[workspace.lints.rust]
# Deny unsafe code in library crates (allow in FFI)
unsafe_code = "warn"

[workspace.lints.clippy]
# Error handling
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# Performance
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
inefficient_to_string = "warn"
large_enum_variant = "warn"
vec_init_then_push = "warn"

# Style
needless_pass_by_value = "warn"
match_same_arms = "warn"
manual_string_new = "warn"
if_not_else = "warn"

# Correctness
float_cmp = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"

# Documentation
missing_docs_in_private_items = "allow"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1

# Integration tests package
[package]
name = "dpb-integration-tests"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
dpb-core = { workspace = true }
dpb-encoders = { workspace = true }
dpb-snn = { workspace = true }
dpb-synth = { workspace = true }

# Test dependencies
approx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ndarray = { workspace = true }

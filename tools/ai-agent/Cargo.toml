[package]
name = "dpb-ai-agent"
version = "0.1.0"
edition = "2021"
authors = ["AuraSense Tech Corporation"]
license = "MIT OR Apache-2.0"
description = "AI Agent infrastructure for Delta-Predictive Biosensing Framework"
rust-version = "1.75.0"
publish = false

# Keep this package out of the main workspace
[workspace]

[[bin]]
name = "dpb-schema-gen"
path = "src/bin/schema_gen.rs"

[[bin]]
name = "dpb-mcp-server"
path = "src/bin/mcp_server.rs"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Async
tokio = { version = "1.42", features = ["full"] }

# Error handling
anyhow = "1.0"

# MCP protocol
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Logging
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
regex = "1.11"

[dev-dependencies]
tempfile = "3.14"

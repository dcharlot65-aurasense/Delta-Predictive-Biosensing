[package]
name = "dpb-wasm"
version = "0.4.0"
edition.workspace = true
authors = ["AuraSense Tech Corporation"]
description = "WebAssembly bindings for DPB Framework - browser-based biosignal processing"
license.workspace = true
repository.workspace = true
keywords = ["wasm", "biosignal", "snn", "neuromorphic", "webassembly"]
categories = ["wasm", "science", "algorithms"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
# Enable WebGPU compute support (experimental)
webgpu = [
    "web-sys/Gpu",
    "web-sys/GpuAdapter",
    "web-sys/GpuDevice",
    "web-sys/GpuQueue",
    "web-sys/GpuBuffer",
    "web-sys/GpuShaderModule",
    "web-sys/GpuComputePipeline",
    "web-sys/GpuBindGroup",
    "web-sys/GpuCommandEncoder",
    "web-sys/GpuComputePassEncoder",
    "web-sys/Navigator",
]

[dependencies]
wasm-bindgen = "0.2.93"
wasm-bindgen-futures = "0.4.43"
js-sys = "0.3.70"

# Web APIs
web-sys = { version = "0.3.70", features = [
    "console",
    "Performance",
    "Window",
    "Navigator",
]}

# Better error messages in browser console
console_error_panic_hook = { version = "0.1.7", optional = true }

# Serialization for complex types
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"

# For timestamp handling
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.43"

[profile.release]
# Optimize for small code size
opt-level = "z"
# Enable link-time optimization
lto = true
# Compile everything in one codegen unit for better optimization
codegen-units = 1
# Abort on panic (smaller code)
panic = "abort"
# Strip symbols
strip = true

[package]
name = "dpb-wasm"
version = "0.4.0"
edition.workspace = true
authors = ["AuraSense Tech Corporation"]
description = "WebAssembly bindings for DPB Framework - browser-based biosignal processing"
license.workspace = true
repository.workspace = true
keywords = ["wasm", "biosignal", "snn", "neuromorphic", "webassembly"]
categories = ["wasm", "science", "algorithms"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
# Enable WebGPU compute support (experimental)
webgpu = [
    "web-sys/Gpu",
    "web-sys/GpuAdapter",
    "web-sys/GpuDevice",
    "web-sys/GpuQueue",
    "web-sys/GpuBuffer",
    "web-sys/GpuShaderModule",
    "web-sys/GpuComputePipeline",
    "web-sys/GpuBindGroup",
    "web-sys/GpuCommandEncoder",
    "web-sys/GpuComputePassEncoder",
    "web-sys/Navigator",
]

[dependencies]
wasm-bindgen = "0.2.93"
wasm-bindgen-futures = "0.4.43"
js-sys = "0.3.70"

# Web APIs
web-sys = { version = "0.3.70", features = [
    "console",
    "Performance",
    "Window",
    "Navigator",
]}

# Better error messages in browser console
console_error_panic_hook = { version = "0.1.7", optional = true }

# Serialization for complex types
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"

# For timestamp handling
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.43"

# The [profile.release] that used to be here -- opt-level "z", lto,
# codegen-units 1, panic abort, strip -- was silently ignored: cargo only
# honours profiles in the workspace root, so this crate was in fact being
# built at the root's opt-level 3. Those settings now live in the root
# manifest as [profile.wasm-release]; build with `--profile wasm-release`.

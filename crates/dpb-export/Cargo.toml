[package]
name = "dpb-export"
version = "0.4.0"
edition.workspace = true
authors = ["AuraSense Tech Corporation"]
description = "Model export capabilities for DPB Framework - ONNX, TensorFlow, and more"
license.workspace = true
repository.workspace = true
keywords = ["onnx", "export", "model", "neural-network", "biosignal"]
categories = ["science", "encoding"]

[features]
default = []
# Enables the ONNX graph builder in onnx.rs. Note that its output is
# currently JSON, not ONNX protobuf -- see the note on
# OnnxExporter::write_onnx_model. This used to pull in tract-onnx,
# which nothing ever called.
onnx = []
# Enable TensorFlow/Keras support
tensorflow = []
# Enable PyTorch export support
pytorch = []
# Enable all export formats
full = ["onnx", "tensorflow", "pytorch"]

[dependencies]
# Error handling
thiserror.workspace = true

# Logging
tracing = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ONNX runtime (optional)

# Numeric operations
ndarray.workspace = true

# UUID for model identification
uuid = { version = "1.0", features = ["v4"] }

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.10"
tracing-subscriber = "0.3"

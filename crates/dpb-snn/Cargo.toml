[package]
name = "dpb-snn"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Spiking neural network architectures and training"

[features]
default = []
gpu = []
cuda = ["gpu", "dep:cudarc"]
metal = ["gpu", "dep:metal"]
# distributed/communication.rs needs crossbeam channels; the feature used to
# gate that code without declaring the dependency, so enabling it did not
# compile.
distributed = ["dep:crossbeam"]

[dependencies]
dpb-core.workspace = true
crossbeam = { workspace = true, optional = true }
ndarray = { workspace = true, features = ["serde"] }
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rand.workspace = true
rand_distr.workspace = true
# Deterministic seeding for the `with_seed` constructors: ChaCha8 gives the
# same stream on every platform and across rand releases.
rand_chacha.workspace = true

# GPU backend dependencies (optional)
cudarc = { workspace = true, optional = true }
metal = { workspace = true, optional = true }

[dev-dependencies]
approx.workspace = true
criterion.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

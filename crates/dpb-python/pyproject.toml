[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "dpb"
# Taken from the crate version in Cargo.toml, which inherits the workspace
# version -- keeps the wheel and the crate from drifting apart.
dynamic = ["version"]
description = "Delta-Predictive Biosensing Framework - Neuromorphic signal processing"
authors = [
    {name = "AuraSense Tech Corporation"}
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
    "neuromorphic",
    "spiking-neural-networks",
    "biosensors",
    "event-based",
    "signal-processing",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]
viz = [
    "matplotlib>=3.5",
    "seaborn>=0.12",
]
all = [
    "dpb[dev,viz]",
]

[project.urls]
Homepage = "https://github.com/dcharlot65-aurasense/Delta-Predictive-Biosensing"
Repository = "https://github.com/dcharlot65-aurasense/Delta-Predictive-Biosensing"
Issues = "https://github.com/dcharlot65-aurasense/Delta-Predictive-Biosensing/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "dpb"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage flags are left to the caller: hardcoding `--cov` makes every plain
# `pytest` run fail unless pytest-cov is installed, and this package ships no
# Python test tree yet.
addopts = ["-v"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313", "py314"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"

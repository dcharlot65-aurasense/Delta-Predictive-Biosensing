[package]
name = "dpb-python"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Python bindings for DPB Framework"

[lib]
name = "dpb"
# `rlib` alongside `cdylib` so the crate can be built and tested by plain cargo;
# maturin takes the cdylib for the wheel.
crate-type = ["cdylib", "rlib"]

[features]
# Enabled by maturin when building a wheel. Leaving it off lets `cargo build`
# and `cargo test` link against libpython and run.
extension-module = ["pyo3/extension-module"]

[dependencies]
dpb-core.workspace = true
dpb-encoders.workspace = true
dpb-neurons.workspace = true
dpb-snn.workspace = true
dpb-synth.workspace = true
pyo3.workspace = true
numpy.workspace = true
ndarray.workspace = true
thiserror.workspace = true
# For real GPU adapter enumeration rather than fabricated device info.
wgpu.workspace = true

[dev-dependencies]
pyo3 = { workspace = true, features = ["auto-initialize"] }
approx = "0.5"

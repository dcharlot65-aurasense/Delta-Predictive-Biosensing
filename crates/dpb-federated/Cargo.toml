[package]
name = "dpb-federated"
version = "0.1.0"
edition.workspace = true
authors = ["AuraSense Tech Corporation"]
description = "Privacy-preserving federated learning for DPB Framework"
license.workspace = true
repository.workspace = true
keywords = ["federated-learning", "privacy", "biosignal", "distributed"]
categories = ["science", "algorithms"]

[features]
default = []
differential-privacy = ["dep:opendp"]
compression = ["dep:zstd"]
async = ["dep:tokio"]
full = ["differential-privacy", "compression", "async"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand.workspace = true
rand_distr.workspace = true

# Optional dependencies
opendp = { version = "0.9", optional = true }
zstd = { version = "0.13", optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }

[dev-dependencies]
tempfile = "3.0"

[package]
name = "dpb-federated"
version = "0.1.0"
edition.workspace = true
authors = ["AuraSense Tech Corporation"]
description = "Privacy-preserving federated learning for DPB Framework"
license.workspace = true
repository.workspace = true
keywords = ["federated-learning", "privacy", "biosignal", "distributed"]
categories = ["science", "algorithms"]

[features]
default = []
# privacy.rs implements the Gaussian and Laplace mechanisms directly on
# top of rand, and does so unconditionally -- this feature gates no code.
# It is kept only so that existing `--features differential-privacy`
# invocations keep working; it previously also pulled in opendp, which
# nothing ever called.
differential-privacy = []
compression = ["dep:zstd"]
async = ["dep:tokio"]
full = ["differential-privacy", "compression", "async"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror.workspace = true
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand.workspace = true
rand_distr.workspace = true

# Optional dependencies
zstd = { version = "0.13", optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }

[dev-dependencies]
tempfile = "3.0"

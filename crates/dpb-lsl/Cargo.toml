[package]
name = "dpb-lsl"
version = "0.4.0"
edition.workspace = true
authors = ["AuraSense Tech Corporation"]
description = "Lab Streaming Layer integration for DPB Framework - real-time biosignal streaming"
license.workspace = true
repository.workspace = true
keywords = ["lsl", "biosignal", "streaming", "real-time", "eeg"]
categories = ["science", "asynchronous"]

[features]
default = []
# Enable native liblsl bindings (requires liblsl installed)
native = []
# Enable async runtime support
async = ["tokio"]
# Full features
full = ["native", "async"]

[dependencies]
# Error handling
thiserror.workspace = true

# Logging
tracing = "0.1"

# Channel communication
crossbeam-channel = "0.5"

# Async runtime (optional)
tokio = { version = "1.0", features = ["rt-multi-thread", "sync", "time", "macros"], optional = true }

# Serialization for configuration
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
serde_json = "1.0"
tracing-subscriber = "0.3"

[build-dependencies]
# For finding liblsl
pkg-config = "0.3"

[package]
name = "dpb-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core types, traits, and GPU infrastructure for DPB Framework"

[features]
default = []
# Intel Gaudi AI accelerator support
intel-gaudi = []
# Link the real Synapse AI SDK rather than the simulation path. gaudi.rs
# branched on this with cfg!() while it was never declared, so the test was
# always false and the branch unreachable.
intel-gaudi-runtime = ["intel-gaudi"]
# Graphcore IPU accelerator support
graphcore-ipu = []
# RISC-V vector accelerator support (src/accelerators/riscv.rs). This gate
# existed in the source but was never declared here, so the module was
# never compiled by anything.
riscv-hal = []
# All hardware accelerators
hardware-accelerators = ["intel-gaudi", "graphcore-ipu", "riscv-hal"]
# CUDA backend (NVIDIA GPUs) - enables cudarc dependency
cuda = ["dep:cudarc"]
# Metal backend (Apple Silicon) - enables metal dependency
metal = ["dep:metal"]
# Vulkan compute backend - enables vulkano dependency
vulkan = ["dep:vulkano"]
# AMD ROCm/HIP backend. Like riscv-hal, this was cfg'd in the source but
# never declared, so BackendType::ROCm could not be built.
rocm = []
# All GPU backends
all-backends = ["cuda", "metal", "vulkan", "rocm"]

[dependencies]
wgpu.workspace = true
bytemuck.workspace = true
glam.workspace = true
ndarray.workspace = true
num-complex.workspace = true
rustfft.workspace = true
tokio.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
rand.workspace = true
rand_distr.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Optional GPU backends
cudarc = { workspace = true, optional = true }
metal = { workspace = true, optional = true }
vulkano = { workspace = true, optional = true }

[dev-dependencies]
approx.workspace = true
criterion.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
proptest.workspace = true

[[bench]]
name = "signal_processing"
harness = false

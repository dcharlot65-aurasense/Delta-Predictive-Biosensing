name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --lib --bins --all-targets

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--all-targets` covers integration tests, examples and benches; doc
      # tests need their own invocation because --all-targets excludes them.
      #
      # This job used to run `--lib` only, which is how integration suites,
      # doc examples and benches came to accumulate years of API drift without
      # anyone noticing: they were never compiled in CI.
      #
      # dpb-python is no longer excluded -- it was, because pyo3 0.23 could not
      # build against the Python 3.14 on current runners, and pyo3 is now 0.29.
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: cargo test --doc
        run: cargo test --workspace --doc

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p dpb-wasm --lib --target wasm32-unknown-unknown

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      # `--all-targets` for the same reason as the test job: a minimum-version
      # check that only sees `--lib` cannot catch a bench or example that needs
      # a newer compiler.
      - run: cargo check --workspace --all-targets

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --lib --bins --all-targets

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # This job used to run `--lib` only, which is how integration suites,
      # doc examples and benches came to accumulate years of API drift without
      # anyone noticing: they were never compiled in CI.
      #
      # Benches are compiled but not run. `cargo test --all-targets` would run
      # them, and the three iai-callgrind benches shell out to a Valgrind-based
      # runner that is not present here (and does not exist for Apple Silicon
      # at all), so the whole invocation dies partway with a confusing error.
      # Compiling them is what catches the drift; executing them is a
      # benchmarking task, not a correctness one.
      #
      # Doc tests need their own invocation either way -- no target selector
      # includes them.
      #
      # dpb-python is no longer excluded -- it was, because pyo3 0.23 could not
      # build against the Python 3.14 on current runners, and pyo3 is now 0.29.
      - name: cargo test
        run: cargo test --workspace --lib --bins --tests --examples
      - name: cargo build --benches
        run: cargo build --workspace --benches
      - name: cargo test --doc
        run: cargo test --workspace --doc

  features:
    name: optional features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Optional features were never compiled anywhere, so they drifted: the
      # dpb-lsl FFI block predated edition 2024's `unsafe extern` rule, and
      # dpb-snn's `distributed` gated code that used crossbeam without
      # declaring it. Neither could have been caught by a default-feature build.
      #
      # `--all-features` is not usable here: it turns on the cuda/metal/vulkan
      # backends, whose build scripts need vendor toolchains no hosted runner
      # has. This lists the sets that are portable; the hardware backends are
      # covered on machines that have the hardware.
      - run: cargo check -p dpb-core      --features hardware-accelerators --all-targets
      - run: cargo check -p dpb-clinical  --features full        --all-targets
      - run: cargo check -p dpb-export    --features full        --all-targets
      - run: cargo check -p dpb-federated --features full        --all-targets
      # `check`, not `test`: dpb-lsl's `native` feature links against liblsl,
      # which no hosted runner has. Type-checking the FFI is what is useful
      # here; its `async` half is covered by the test job above.
      - run: cargo check -p dpb-lsl       --features full        --all-targets
      - run: cargo check -p dpb-snn       --features distributed --all-targets
      - run: cargo check -p dpb-viz       --features web         --all-targets
      - run: cargo check -p dpb-mobile    --features quantized   --all-targets

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Build rather than check, and with the profile the bundle actually
      # ships under, so a broken [profile.wasm-release] is caught here.
      - run: cargo build -p dpb-wasm --lib --profile wasm-release --target wasm32-unknown-unknown

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      # `--all-targets` for the same reason as the test job: a minimum-version
      # check that only sees `--lib` cannot catch a bench or example that needs
      # a newer compiler.
      - run: cargo check --workspace --all-targets
